<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>

  </defs></svg>
  <main class="birthday" id="app" data-dance="ready" data-ending="chiika" data-phase="idle" data-state="idle">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">러버가<br>준비한 게 있대<span class="ellipsis">…</span></h1>
    </section>

    <div class="scene" id="scene">
      <div class="scene-glow"></div>
      <svg class="scene-star star-one"><use href="#star"/></svg>
      <svg class="scene-star star-two"><use href="#star"/></svg>
      <svg class="scene-heart"><use href="#heart"/></svg>
      <div class="speech" id="speech" aria-hidden="true">
        <svg class="speech-outline" viewBox="0 0 160 100" preserveAspectRatio="none">
          <path class="speech-contour" d="M28 12C8 20 6 39 14 54C19 64 28 70 40 72L31 91Q48 85 59 75C89 80 133 76 146 58C160 39 150 19 130 11C102 0 53 2 28 12Z"/>
          <path class="speech-fluster" d="M143 5l4-4m5 11 6-2"/>
        </svg>
        <span id="speechText">으…</span>
      </div>
      <div class="ground" aria-hidden="true"></div>
      <button class="character-button" id="characterButton" type="button" aria-label="꾹 눌러 치이카와에게 용기 주기">
        <img class="character" id="character" src="assets/character/baked-chiika-tiptoe-determined-v1.webp" width="320" height="340" alt="생크림과 촛불, 리본으로 꾸민 치이카와" draggable="false">
      </button>
      <img class="shake-lines" src="assets/effects/shake-lines.svg" alt="" aria-hidden="true">
      <div class="party-scene" id="partyScene" hidden><img src="assets/character/party.webp" width="540" height="380" alt="치이카와, 하치와레, 우사기가 딸기 케이크를 들고 함께 생일을 축하해요" draggable="false"></div>
      <div class="usagi-takeover" id="usagiTakeover" hidden aria-hidden="true"><img id="usagiBump" width="320" height="340" alt="" draggable="false"></div>
      <span class="impact-word" aria-hidden="true">퐁!</span>
      <div class="burst-message" id="burstMessage" aria-hidden="true"><small>와아—!!</small><strong id="burstText"></strong><svg><use href="#heart"/></svg></div>
      <div class="particles" id="particles" aria-hidden="true"></div>
    </div>

    <div class="scene-caption" id="sceneCaption"><span class="tiny-heart"><svg><use href="#heart"/></svg></span><span id="captionText">꼬물… 꼬물…</span></div>

    <form class="composer" id="composer" autocomplete="off" hidden>
      <div class="field-heading"><label for="messageInput">마지막에 전할 말</label><span id="messageCount">0 / 60</span></div>
      <textarea id="messageInput" rows="3" maxlength="120" placeholder="여기에 할 말을 입력하세요." aria-describedby="messageHelp formError" required></textarea>
      <p class="field-help" id="messageHelp">60자 · 최대 3줄. 러버가 꼭 전해줄게.</p>
      <p class="form-error" id="formError" role="alert" hidden></p>
      <button class="action-button" id="makeLinkButton" type="submit"><svg class="icon"><use href="#heart"/></svg>링크 만들기</button>
    </form>

    <section class="link-panel" id="linkPanel" aria-label="전할 링크" hidden>
      <p class="link-help" id="linkHelp">이 링크에 네 마음을 담았어.</p>
      <label class="sr-only" for="generatedLink">공유할 링크</label>
      <input id="generatedLink" class="link-input" readonly type="text" spellcheck="false">
      <div class="link-actions"><button class="action-button" id="shareButton" type="button">공유하기</button><button class="outline-button" id="copyButton" type="button">링크 복사</button></div>
      <p class="link-status" id="linkStatus" role="status" aria-live="polite"></p>
      <div class="secondary-actions"><button class="text-button" id="previewButton" type="button">미리 보기</button><button class="text-button" id="editButton" type="button">문구 수정</button></div>
    </section>

    <section class="controls" id="controls" aria-label="용기 주기" hidden>
      <div class="meter-meta"><span id="meterLabel">용기</span><span><strong id="percent">0</strong><span class="percent-mark">%</span></span></div>
      <div class="meter" id="meter" role="progressbar" aria-label="치이카와의 용기" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="meter-fill" id="meterFill"></div><svg class="meter-heart" id="meterHeart"><use href="#heart"/></svg></div>

    </section>

    <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true">꾹 눌러 치이카와에게 용기를 주세요.</p>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      const targetPattern = /치이가(?=(\s|<br\s*\/?>)*(준비한 게|대신|꼭 전해줄게))/g;
      const applyRubber = () => {
        const titleEl = document.getElementById('title');
        if (titleEl && targetPattern.test(titleEl.innerHTML)) {
          titleEl.innerHTML = titleEl.innerHTML.replace(targetPattern, '러버가');
        }
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          if (targetPattern.test(node.nodeValue)) {
            node.nodeValue = node.nodeValue.replace(targetPattern, '러버가');
          }
        }
      };
      applyRubber();
      new MutationObserver(applyRubber).observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
      });
    });
  </script>
